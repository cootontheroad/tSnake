fy) { valid = false; break; }

tileSize, tileSize);

	  function update() {
	  
	 if ((nextDir.x !== -dir.x) || (nextDir.y !== -dir.y)) {
          dir = nextDir;
		}
		
		var head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };
        if (head.x < 0) head.x = tilesX - 1;
		if (head.x >= tilesX) head.x = 0;

            gameOver();

	 function keyDown(e) {

	   if (key === 37) { nextDir = { x: -1, y: 0 }; e.preventDefault && e.preventDefault(); }

	   if (key === 40) { nextDir = [ x: 0, y: 1 }; e.preventDefualt && e.preventDefault(); }
	   
	   
	 } 
	 
	 function starGame() {

	 }
	 
	 function stopGame() {
	   running = false;
	   if (intervalId) {

		 intervalId = null;
	   }
	 }
	 
	 function restartGame() {
